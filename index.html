<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D House Structure</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body { font-family: system-ui, sans-serif; background: #87ceeb; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
      pointer-events: none;
      max-width: 260px;
      line-height: 1.5;
    }
    a.cost-link {
      pointer-events: auto;
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      background: #ffeb3b;
      color: #000;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    a.cost-link:hover { background: #fff34d; }
  </style>
</head>
<body>
  <div id="info">
    <strong>3D House — Setup</strong><br />
    Drag: rotate · Right-click: pan · Wheel: zoom
    <br />
    <a class="cost-link" href="costos.html">Ver costos (COP) →</a>
  </div>

  <!-- Importmap: maps "three" to the ES module CDN build. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
